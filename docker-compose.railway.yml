# Railway Docker Compose configuration for DSpace stack
services:
  dspacedb:
    image: postgres:16
    environment:
      POSTGRES_USER: dspace
      POSTGRES_PASSWORD: dspace
      POSTGRES_DB: dspace
    volumes:
      - pgdata:/var/lib/postgresql/data

  dspacesolr:
    image: solr:9
    command: >
      sh -c "
        solr-create -c discovery -c authority -c statistics -c oai -c suggestion -c qaevent &&
        exec solr -f
      "
    volumes:
      - solrdata:/var/solr/data

  dspace:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - dspace__P__server__P__url=https://${RAILWAY_PUBLIC_DOMAIN}/server
      - dspace__P__ui__P__url=https://${RAILWAY_PUBLIC_DOMAIN}
      - db__P__url=jdbc:postgresql://dspacedb:5432/dspace
      - db__P__username=dspace
      - db__P__password=dspace
      - solr__P__server=http://dspacesolr:8983/solr
    depends_on:
      - dspacedb
      - dspacesolr
    ports:
      - "8080:8080"

  dspace-angular:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      - DSPACE_UI_SSL=false
      - DSPACE_UI_HOST=${RAILWAY_PUBLIC_DOMAIN}
      - DSPACE_UI_PORT=4000
      - DSPACE_UI_NAMESPACE=/
      - DSPACE_REST_SSL=true
      - DSPACE_REST_HOST=${RAILWAY_PUBLIC_DOMAIN}
      - DSPACE_REST_PORT=443
      - DSPACE_REST_NAMESPACE=/server
      - DSPACE_REST_SSRBASEURL=https://${RAILWAY_PUBLIC_DOMAIN}/server
    depends_on:
      - dspace
    ports:
      - "4000:4000"

  fmc-adapter:
    build:
      context: ./fmclib/api
      dockerfile: Dockerfile
    environment:
      - DSPACE_API_URL=https://${RAILWAY_PUBLIC_DOMAIN}/server/api
    depends_on:
      - dspace
    ports:
      - "5001:5001"

volumes:
  pgdata:
  solrdata:
